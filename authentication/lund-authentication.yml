- surface: LUCRIS / Research Portal Pure web service
  url: https://portal.research.lu.se/ws/api
  observed_status: 500
  observed_body: '{"timestamp":...,"status":999,"error":"None"}'
  detail: >-
    The Elsevier Pure web service path exists on Lund's portal host but refuses anonymous
    callers with an HTTP 500 carrying Pure's status 999 envelope. Lund documents that LUCRIS
    content can be retrieved via API for institutional reporters and web editors; there is
    no open self-service route to a key, and the contract is Elsevier's in any case.
