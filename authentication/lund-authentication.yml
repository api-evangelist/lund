  type: none
  description: >-
    No authentication. Confirmed by anonymous HTTP GET returning 200 with real data on:
    the LUP Search API, both OAI-PMH repositories, both SRU services, both unAPI services,
    the RSS feeds, the bulk export endpoint and the published JSON Schema.
  sources:
  - https://lup.lub.lu.se/search/publication?q=dna&format=json
  - https://lup.lub.lu.se/oai?verb=Identify
  - https://lup.lub.lu.se/sru?operation=searchRetrieve&version=1.1&query=dna
  - https://lup.lub.lu.se/search/unapi
  - https://lup.lub.lu.se/student-papers/search/publication?q=dna&format=json
  - https://lup.lub.lu.se/student-papers/oai?verb=Identify
- name: swamid-saml-sso
  type: saml
  description: >-
    SAML 2.0 / Shibboleth single sign-on against Lund's own Identity Provider
    (entityID https://idpv4.lu.se/idp/shibboleth, scope lu.se), registered in the Swedish
    national federation SWAMID and interfederated through eduGAIN. This is the gate in
    front of staff and student services — it authenticates people with an institutional
    affiliation, and it is not an API credential a third-party developer can obtain.
  sources:
  - https://idpv4.lu.se/idp/shibboleth
  - https://mds.swamid.se/md/swamid-idp.xml
