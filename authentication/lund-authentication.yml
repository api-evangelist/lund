note: >-
  Lund University's public machine-readable surfaces are entirely anonymous — no key, no
  token, no registration. Everything that is gated is gated by federated institutional
  affiliation (SWAMID SAML), not by an API credential, which is the characteristic access
  model of a university rather than a commercial API provider. There is no developer
  registration flow, no self-service key issuance, and no plan to buy.
schemes:
