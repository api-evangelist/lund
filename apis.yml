aid: lund
name: Lund University
x-type: university
x-category: Public Research University
description: >-
  Lund University is a public research university in Lund, Sweden, founded in 1666, with
  roughly 46,000 students across nine faculties and the MAX IV and ESS research
  infrastructures on its doorstep. Its programmable footprint is narrow, real, and almost
  entirely library-operated: Lund University Libraries run two self-hosted publication
  repositories on the university's own host — Lund University Publications (LUP) for
  research output and LUP Student Papers for theses and degree projects — and each exposes
  the same open, keyless stack of a JSON(P) search API, an OAI-PMH 2.0 repository, an SRU
  1.1/CQL search service, a unAPI 1 discovery service, RSS feeds and a bulk bibliographic
  export. Lund also operates its own Shibboleth Identity Provider, registered in the Swedish
  national federation SWAMID and interfederated through eduGAIN, which is a genuinely
  institution-operated machine-readable surface. Outside those, there is no central
  developer portal, no self-service API key, no open data portal at data.lu.se, and no
  public JSON endpoint behind the course finder — the education search at
  lunduniversity.lu.se is server-rendered with nothing machine-readable underneath. The
  research portal at portal.research.lu.se is the LUCRIS research information system running
  on Elsevier Pure: the data is Lund's, the contract is Elsevier's, and its web service
  refuses anonymous callers. Library discovery (LUBcat, LUBsearch) and the timetable
  (TimeEdit) are likewise vendor platforms carrying Lund's name.
