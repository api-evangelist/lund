- aid: lund:research-portal
  name: Lund University Research Portal (LUCRIS / Elsevier Pure)
  description: >-
    Lund's tenant deployment of Elsevier Pure, branded LUCRIS, covering researchers,
    organisations, outputs, projects, datasets and activities at portal.research.lu.se. The
    data and the deployment are Lund's; the contract, the record model and the web service
    are Elsevier's, so no Pure specification is stored under this institution. The Pure web
    service path exists on Lund's host but refuses anonymous callers with HTTP 500 and
    Pure's status 999 envelope. Lund documents that LUCRIS content can be retrieved by API
    or RSS for institutional reporters and web editors — there is no open route to a key.
  humanURL: https://portal.research.lu.se/
