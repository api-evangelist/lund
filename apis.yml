- aid: lund:lund-publication-api
  name: Lund University Publications Search API
  description: >-
    Keyless REST/JSON(P) search over the Lund University Publications (LUP) research-output
    database, operated by Lund University Libraries on Lund's own host. Supports CQL-style
    queries, paging and sorting, plus per-record and bulk bibliographic export in BibTeX,
    RIS, EndNote, CSV and Excel. Author records carry ORCID iDs and DOIs. Note that the
    JSON Schema Lund publishes at /search/schema/publication.json describes the upstream
    repository record model — it still carries UGent classification codes and VABB fields —
    and not the shape the live search endpoint returns; the OpenAPI below models both, with
    PublicationHit derived from observed live responses.
