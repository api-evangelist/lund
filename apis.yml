x-coverage:
  state: covered
  reason: covered
  detail: >-
    Every surface on this profile was reached anonymously and graded from a status code and
    a response body, not from a link. Eleven institution-operated endpoints returned 200
    with real data across two self-hosted repositories, and Lund's own Shibboleth IdP
    metadata was fetched and confirmed present in the SWAMID aggregate. The absences are
    measured too, not assumed: data.lu.se and api.lu.se do not resolve, the course finder
    has no JSON endpoint behind it (/study/find-education/json is 404), and the Elsevier
    Pure web service at portal.research.lu.se/ws/api returns HTTP 500 with Pure's status 999
    envelope to anonymous callers. Lund's own documentation is wrong about three of its own
    base URLs — /search/oai, /search/sru and /search/siteindex.xml all 404 while /oai, /sru
    and /siteindex.xml serve — and the JSON Schema it publishes describes the upstream
    repository record model rather than its live API response. Both facts are recorded on
    the affected entries rather than papered over.
  evidence:
