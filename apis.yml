- aid: lund:idp-saml-metadata
  name: Lund University Shibboleth Identity Provider (SWAMID)
  description: >-
    Lund University's own SAML 2.0 / Shibboleth Identity Provider, serving machine-readable
    federation metadata at its entityID. The EntityDescriptor declares an IDPSSODescriptor,
    the Shibboleth scope lu.se, DiscoHints for lu.se and lth.se, and Swedish and English
    UIInfo. The entity is registered in SWAMID, Sweden's national identity federation, and
    is present in the SWAMID IdP aggregate that feeds eduGAIN. Institution-operated by
    definition and the one surface here that is not a library service. It authenticates
    people with a Lund affiliation; it is not a credential a third-party developer can get.
  humanURL: https://swamid.se/
  baseURL: https://idpv4.lu.se/idp/shibboleth
